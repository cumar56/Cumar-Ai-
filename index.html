<!DOCTYPE html>
<html lang="so">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cumar AI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0b0f14;
      color: white;
      min-height: 100vh;
    }

    .app {
      max-width: 900px;
      margin: auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 20px;
      border-bottom: 1px solid #202832;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 45px;
      height: 45px;
      border-radius: 14px;
      background: linear-gradient(135deg, #00d4ff, #7c3aed);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: bold;
    }

    .title h1 {
      font-size: 20px;
    }

    .title p {
      color: #8b96a5;
      font-size: 13px;
      margin-top: 3px;
    }

    main {
      flex: 1;
      padding: 25px 18px 130px;
    }

    .welcome {
      text-align: center;
      margin: 50px 0 35px;
    }

    .welcome h2 {
      font-size: 30px;
      margin-bottom: 10px;
    }

    .welcome p {
      color: #8b96a5;
      line-height: 1.6;
    }

    .quick-actions {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      max-width: 600px;
      margin: auto;
    }

    .quick {
      background: #111821;
      border: 1px solid #26313d;
      color: white;
      padding: 16px;
      border-radius: 14px;
      text-align: left;
      cursor: pointer;
    }

    .quick:active {
      transform: scale(.98);
    }

    .quick strong {
      display: block;
      margin-bottom: 5px;
    }

    .quick span {
      color: #8b96a5;
      font-size: 12px;
    }

    .chat {
      max-width: 700px;
      margin: 30px auto 0;
    }

    .message {
      padding: 15px;
      border-radius: 15px;
      margin-bottom: 12px;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .user {
      background: #1b2633;
      margin-left: 30px;
    }

    .ai {
      background: #111821;
      border: 1px solid #26313d;
      margin-right: 30px;
    }

    .input-area {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(11,15,20,.96);
      border-top: 1px solid #202832;
      padding: 12px;
    }

    .input-box {
      max-width: 900px;
      margin: auto;
      display: flex;
      gap: 10px;
      background: #111821;
      border: 1px solid #2a3542;
      border-radius: 18px;
      padding: 8px;
    }

    textarea {
      flex: 1;
      resize: none;
      border: none;
      outline: none;
      background: transparent;
      color: white;
      padding: 12px;
      min-height: 45px;
      max-height: 120px;
      font-size: 15px;
    }

    textarea::placeholder {
      color: #687484;
    }

    button.send {
      width: 48px;
      height: 48px;
      border: none;
      border-radius: 14px;
      background: #7c3aed;
      color: white;
      font-size: 20px;
      cursor: pointer;
    }

    @media (max-width: 500px) {
      .welcome h2 {
        font-size: 25px;
      }

      .quick-actions {
        grid-template-columns: 1fr;
      }

      .user {
        margin-left: 10px;
      }

      .ai {
        margin-right: 10px;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <header>
      <div class="logo">C</div>

      <div class="title">
        <h1>Cumar AI</h1>
        <p>Personal AI Assistant</p>
      </div>
    </header>

    <main>

      <div class="welcome">
        <h2>👋 Salaam Cumar</h2>
        <p>
          Anigu waxaan noqon doonaa AI Agent-kaaga gaarka ah.<br>
          Maxaad rabtaa inaan kuu qabto?
        </p>
      </div>

      <div class="quick-actions">

        <button class="quick" onclick="quickPrompt('Ii qor YouTube script')">
          ✍️
          <strong>Qor Script</strong>
          <span>YouTube, Facebook & TikTok</span>
        </button>

        <button class="quick" onclick="quickPrompt('Ii samee research')">
          🔎
          <strong>Research</strong>
          <span>Raadi oo soo koob macluumaad</span>
        </button>

        <button class="quick" onclick="quickPrompt('Ii samee website')">
          💻
          <strong>Website</strong>
          <span>Samee fikrad iyo code</span>
        </button>

        <button class="quick" onclick="quickPrompt('Ii samee AI prompt')">
          🤖
          <strong>AI Prompt</strong>
          <span>Image, video & automation</span>
        </button>

      </div>

      <div id="chat" class="chat"></div>

    </main>

  </div>

  <div class="input-area">

    <div class="input-box">

      <textarea
        id="message"
        placeholder="Maxaan kuu qabtaa?"
        rows="1"></textarea>

      <button class="send" onclick="sendMessage()">
        ➤
      </button>

    </div>

  </div>


  <script>

    function quickPrompt(text) {
      document.getElementById("message").value = text;
      document.getElementById("message").focus();
    }

    function addMessage(text, type) {

      const chat = document.getElementById("chat");

      const message = document.createElement("div");

      message.className = "message " + type;

      message.textContent = text;

      chat.appendChild(message);

      window.scrollTo({
        top: document.body.scrollHeight,
        behavior: "smooth"
      });
    }

    function sendMessage() {

      const input = document.getElementById("message");

      const text = input.value.trim();

      if (!text) return;

      addMessage(text, "user");

      input.value = "";

      setTimeout(() => {

        addMessage(
          "Waan helay amarkaaga. 🧠\n\nAI engine-ka dhabta ah weli lama xirin. Tallaabada xigta waxaan Cumar AI ku xiri doonaa AI model si uu amarradaada dhab ahaan u fuliyo.",
          "ai"
        );

      }, 500);
    }

    document
      .getElementById("message")
      .addEventListener("keydown", function(event) {

        if (event.key === "Enter" && !event.shiftKey) {

          event.preventDefault();

          sendMessage();

        }

      });

  </script>

</body>
  </html>
